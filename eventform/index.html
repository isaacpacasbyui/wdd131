<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">

  <meta
    name="description"
    content="Register for an event and create your student or guest ticket."
  >

  <title>Event Ticket Form</title>

  <link rel="icon" type="image/svg+xml" href="favicon.svg">
  <link rel="stylesheet" href="styles.css">
  <script src="script.js" defer></script>
</head>

<body>
  <main>
    <section class="card" aria-labelledby="form-title">
      <h1 id="form-title">Event Ticket</h1>
      <p class="intro">Complete the form to create your ticket.</p>

      <form id="ticket-form" novalidate>
        <div class="row">
          <div class="field">
            <label for="first-name">First Name</label>
            <input
              type="text"
              id="first-name"
              name="firstName"
              autocomplete="given-name"
              required
            >
          </div>

          <div class="field">
            <label for="last-name">Last Name</label>
            <input
              type="text"
              id="last-name"
              name="lastName"
              autocomplete="family-name"
              required
            >
          </div>
        </div>

        <div class="field">
          <label for="email">Email</label>
          <input
            type="email"
            id="email"
            name="email"
            autocomplete="email"
            required
          >
        </div>

        <div class="row">
          <div class="field">
            <label for="type">Type</label>
            <select id="type" name="type" required>
              <option value="">Choose one</option>
              <option value="student">Student</option>
              <option value="guest">Guest</option>
            </select>
          </div>

          <div class="field">
            <label for="event-date">Event Date</label>
            <input
              type="date"
              id="event-date"
              name="eventDate"
              required
            >
          </div>
        </div>

        <div id="extra-field" class="field" hidden>
          <label id="extra-label" for="extra-input">
            Student I#
          </label>
          <input
            type="text"
            id="extra-input"
            name="verification"
            disabled
          >
        </div>

        <button type="submit">Create Ticket</button>
      </form>

      <div id="errors" role="alert" hidden></div>

      <section
        id="ticket"
        class="ticket"
        aria-live="polite"
        aria-atomic="true"
        hidden
      ></section>
    </section>
  </main>
</body>
</html>
